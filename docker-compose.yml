services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ragdb
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres-fga:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fga
      POSTGRES_PASSWORD: fga
      POSTGRES_DB: fga
    ports:
      - "5432:5432"
    volumes:
      - postgres_fga_data:/var/lib/postgresql/data
    restart: unless-stopped

  openfga:
    image: openfga/openfga:latest
    command: run --playground-enabled --authn-method=none
    ports:
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://fga:fga@postgres-fga:5432/fga
      OPENFGA_LOG_LEVEL: info
      OPENFGA_PLAYGROUND_ENABLED: "true"
    depends_on:
      - postgres-fga
      - openfga-migrate
    restart: unless-stopped

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://fga:fga@postgres-fga:5432/fga
    depends_on:
      - postgres-fga
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.17
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    restart: unless-stopped

  chroma-ui:
    image: fengzhichao/chromadb-admin:latest
    ports:
      - "3001:3001"
    restart: unless-stopped

  # Ontology graph database (Neo4j) — the enterprise-ontology visualization
  # merged into this API (app/services/ontology_sync_service.py,
  # app/services/ontology_graph_service.py, app/api/v1/ontology_graph.py).
  # No separate backend process for it anymore; the graph UI lives at
  # front-end/src/pages/GraphPage.tsx and calls this same api service.
  neo4j:
    image: neo4j:5.23-community
    # NOT env_file: the official neo4j image auto-converts *every* env var
    # named NEO4J_xxx into a config setting (eg. it tried to read our own
    # NEO4J_URI as a "URI" config key and refused to boot) — so this
    # container can only ever be handed the one variable it actually
    # understands (NEO4J_AUTH), built here from NEO4J_PASSWORD via
    # Compose's own ${} substitution (reads a `.env` file in this
    # directory, or the real shell env — see .env.example).
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ontology12345}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  api:
    build: .
    env_file:
      - ${BACKEND_ENV_FILE:-.env.local}
    environment:
      PYTHONPATH: /app
    depends_on:
      - mysql
      - redis
      - minio
      - openfga
      - chroma
      - neo4j
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - ${BACKEND_ENV_FILE:-.env.local}
    environment:
      PYTHONPATH: /app
    depends_on:
      - mysql
      - redis
      - minio
      - openfga
      - chroma
      - neo4j
    command: celery -A app.workers.tasks.celery_app worker -Q ingest_queue -l info --concurrency=1
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
  chroma_data:
  postgres_fga_data:
  neo4j_data:
  neo4j_logs:
